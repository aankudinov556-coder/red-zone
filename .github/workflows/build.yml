name: Build Redzone (Windows)

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      - name: Check artefacts
        shell: pwsh
        run: |
          $vst = "build/Redzone_artefacts/Release/VST3/Redzone.vst3"
          if (-not (Test-Path $vst)) {
            Get-ChildItem -Recurse build/Redzone_artefacts | Select-Object -ExpandProperty FullName
            throw "VST3 bundle not found at $vst"
          }
          Get-ChildItem -Recurse $vst | Select-Object -ExpandProperty FullName

      - name: Check Windows 8 compatibility (no Win10-only imports)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -find "VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin not found" }
          # Functions that only exist on Windows 10+; they must never be imported statically.
          $banned = @('GetSystemMetricsForDpi','GetDpiForWindow','GetDpiForSystem','AdjustWindowRectExForDpi',
                      'SetThreadDpiAwarenessContext','GetThreadDpiAwarenessContext','GetWindowDpiAwarenessContext',
                      'GetAwarenessFromDpiAwarenessContext','EnableNonClientDpiScaling','SystemParametersInfoForDpi',
                      'D2D1CreateFactory1','GetDpiForMonitor')
          $bins = @("build/Redzone_artefacts/Release/Standalone/Redzone.exe") +
                  (Get-ChildItem -Recurse "build/Redzone_artefacts/Release/VST3/Redzone.vst3" -Filter *.vst3 -File | ForEach-Object FullName)
          $fail = $false
          foreach ($b in $bins) {
            $imports = & $dumpbin /imports $b | Out-String
            foreach ($f in $banned) {
              if ($imports -match "\b$f\b") { Write-Host "::error::$b statically imports $f (Windows 10+ only)"; $fail = $true }
            }
            Write-Host "checked $b"
          }
          if ($fail) { throw "Binary is not Windows 8 compatible" }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=0.1.${{ github.run_number }}" "/DBuildDir=..\build" installer\redzone.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Zip VST3 (manual install)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/Redzone_artefacts/Release/VST3/Redzone.vst3 -DestinationPath dist/Redzone-VST3.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: Redzone-Windows
          path: dist/*

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: Redzone build ${{ github.run_number }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.exe
            dist/*.zip
